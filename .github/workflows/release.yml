name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rebuild-cache:
        description: 'Force rebuild all Maven caches (does not run a release)'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

permissions:
  actions: write
  contents: write
  # cosign keyless requires a fresh GitHub Actions OIDC token to mint a
  # short-lived Fulcio cert. Without id-token: write, the sign-blob step
  # uses a stale token from job start and Fulcio rejects it as expired
  # for any matrix cell whose jpackage build runs longer than the token's
  # 10-minute TTL.
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
      latest: ${{ steps.get-versions.outputs.latest }}
    steps:
      - uses: actions/checkout@v6
      - id: get-versions
        run: |
          VERSIONS=$(ls -1 okapi-releases | sort -V | jq -R -s -c 'split("\n") | map(select(length > 0))')
          LATEST=$(ls -1 okapi-releases | sort -V | tail -1)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

  cache-deps:
    if: github.event_name == 'workflow_dispatch'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        okapi-version: ${{ fromJson(needs.setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync per-version POM parent version
        run: |
          PARENT_VERSION=$(sed -n '/<artifactId>okapi-bridge-parent<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' pom.xml)
          for pom in okapi-releases/*/pom.xml; do
            sed -i "/<parent>/,/<\/parent>/s|<version>[^<]*</version>|<version>${PARENT_VERSION}</version>|" "$pom"
          done

      - name: Delete Maven cache for rebuild
        if: inputs.rebuild-cache == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh cache list --key "maven-okapi-${{ matrix.okapi-version }}-" --json id -q '.[].id'); do
            gh cache delete "$id" || true
          done

      - name: Compute dependency hash (ignoring version bumps)
        id: dep-hash
        run: |
          HASH=$(cat pom.xml okapi-releases/${{ matrix.okapi-version }}/pom.xml \
            | grep -v '<version>' | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Maven repository (Okapi ${{ matrix.okapi-version }})
        uses: actions/cache@v5
        id: maven-cache
        with:
          path: ~/.m2/repository
          key: maven-okapi-${{ matrix.okapi-version }}-${{ steps.dep-hash.outputs.hash }}
          restore-keys: maven-okapi-${{ matrix.okapi-version }}-

      - name: Generate version pom if missing
        run: |
          if [ ! -f "okapi-releases/${{ matrix.okapi-version }}/pom.xml" ]; then
            ./scripts/generate-version-pom.sh ${{ matrix.okapi-version }}
          fi

      - name: Resolve dependencies
        if: steps.maven-cache.outputs.cache-hit != 'true'
        run: mvn -B dependency:go-offline -f okapi-releases/${{ matrix.okapi-version }}/pom.xml

      - name: Verify resolved JARs are valid
        if: steps.maven-cache.outputs.cache-hit != 'true'
        run: |
          CORRUPT=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::error::Corrupt JAR after resolution: $jar"
              CORRUPT=$((CORRUPT + 1))
            fi
          done < <(find ~/.m2/repository/net/sf/okapi -name '*.jar' -type f -print0)
          if [ "$CORRUPT" -gt 0 ]; then
            echo "::error::$CORRUPT corrupt JAR(s) after dependency resolution — aborting to prevent caching bad artifacts"
            exit 1
          fi

  build:
    if: github.event_name == 'push'
    needs: [setup]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        okapi-version: ${{ fromJson(needs.setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync per-version POM parent version
        run: |
          PARENT_VERSION=$(sed -n '/<artifactId>okapi-bridge-parent<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' pom.xml)
          for pom in okapi-releases/*/pom.xml; do
            sed -i "/<parent>/,/<\/parent>/s|<version>[^<]*</version>|<version>${PARENT_VERSION}</version>|" "$pom"
          done

      - name: Compute dependency hash (ignoring version bumps)
        id: dep-hash
        run: |
          HASH=$(cat pom.xml okapi-releases/${{ matrix.okapi-version }}/pom.xml \
            | grep -v '<version>' | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Cache Maven repository (Okapi ${{ matrix.okapi-version }})
        uses: actions/cache@v5
        id: maven-cache
        with:
          path: ~/.m2/repository
          key: maven-okapi-${{ matrix.okapi-version }}-${{ steps.dep-hash.outputs.hash }}
          restore-keys: maven-okapi-${{ matrix.okapi-version }}-

      - name: Generate version pom if missing
        run: |
          if [ ! -f "okapi-releases/${{ matrix.okapi-version }}/pom.xml" ]; then
            ./scripts/generate-version-pom.sh ${{ matrix.okapi-version }}
          fi

      - name: Resolve dependencies (cache miss)
        if: steps.maven-cache.outputs.cache-hit != 'true'
        run: mvn -B dependency:go-offline -f okapi-releases/${{ matrix.okapi-version }}/pom.xml

      - name: Build with Okapi ${{ matrix.okapi-version }}
        run: mvn -B package -f okapi-releases/${{ matrix.okapi-version }}/pom.xml

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
          OKAPI_VERSION: ${{ matrix.okapi-version }}
        run: ./scripts/package-release.sh "${TAG#v}" "$OKAPI_VERSION"

      - name: Extract capabilities JSON for registry
        if: matrix.okapi-version == needs.setup.outputs.latest
        run: jq '.capabilities' dist/plugin/manifest.json > capabilities.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: okapi-bridge-${{ matrix.okapi-version }}
          path: |
            okapi-bridge-*.tar.gz
            okapi-bridge-*.tar.gz.sha256
            capabilities.json

      - name: Upload jar-with-dependencies (for v2 packaging)
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.okapi-version }}
          path: okapi-releases/${{ matrix.okapi-version }}/target/neokapi-bridge-*-jar-with-dependencies.jar

  package-v2:
    # Mode-C plugin tarballs per (okapi-version, os, arch). Each tarball
    # is built with `jpackage --type app-image`, bundling a native
    # launcher + JRE built from JDK 17. jpackage requires running on
    # the target OS — cross-build is unsupported — so the matrix is
    # one runner per host architecture.
    if: github.event_name == 'push'
    needs: [setup, build]
    strategy:
      fail-fast: false
      matrix:
        okapi-version: ${{ fromJson(needs.setup.outputs.versions) }}
        target:
          - { os: linux,   arch: amd64, runner: ubuntu-latest,    jdk: temurin }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, jdk: temurin }
          - { os: darwin,  arch: arm64, runner: macos-latest,     jdk: temurin }
          - { os: windows, arch: amd64, runner: windows-latest,   jdk: temurin }
          # Windows on ARM64 uses the Microsoft Build of OpenJDK, not
          # Temurin: Eclipse Adoptium publishes no Windows/AArch64 JDK 17
          # (Temurin's Windows-on-Arm support starts at JDK 21), whereas
          # Microsoft ships a version-matched Win/arm64 17 LTS and maintains
          # the upstream Windows-on-Arm OpenJDK port. windows-11-arm is GA
          # and free on public repos.
          - { os: windows, arch: arm64, runner: windows-11-arm,   jdk: microsoft }
          # darwin/amd64 (Intel Mac) is intentionally not in the matrix —
          # macos-13 runners are scarce on GitHub Actions and Apple has
          # dropped Intel from new product lines. Apple Silicon users
          # get the native arm64 build; Intel Mac users can install via
          # Rosetta or run the JAR directly with their own JRE 17+.
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go (manifest-gen)
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Set up JDK 17 (jpackage source + bundled runtime image)
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.target.jdk }}
          java-version: '17'

      - name: Download JAR for ${{ matrix.okapi-version }}
        uses: actions/download-artifact@v8
        with:
          name: jar-${{ matrix.okapi-version }}
          path: okapi-releases/${{ matrix.okapi-version }}/target/

      - name: Build v2 plugin tarball (jpackage)
        shell: bash
        env:
          OKAPI_VERSION: ${{ matrix.okapi-version }}
          TARGET_OS: ${{ matrix.target.os }}
          TARGET_ARCH: ${{ matrix.target.arch }}
        run: |
          ./scripts/package-release-v2.sh \
            --okapi-version "$OKAPI_VERSION" \
            --os "$TARGET_OS" \
            --arch "$TARGET_ARCH"

      - name: Install cosign
        if: ${{ !(matrix.target.os == 'windows' && matrix.target.arch == 'arm64') }}
        uses: sigstore/cosign-installer@v3

      - name: Install cosign (Windows/arm64, build from source)
        # sigstore/cosign-installer has no Windows/arm64 cosign binary —
        # the project publishes none, so the installer aborts with
        # "unsupported architecture ARM64". cosign is itself a Go program
        # and Go is already set up above, so build a native arm64 cosign
        # from source and put it on PATH for the sign step below.
        # GOTOOLCHAIN=auto lets `go install` fetch the toolchain cosign's
        # go.mod requires if it's newer than the runner's Go.
        if: ${{ matrix.target.os == 'windows' && matrix.target.arch == 'arm64' }}
        shell: bash
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.2
          # setup-go doesn't add GOPATH/bin to PATH; cygpath -w normalizes
          # to a Windows path so the bash sign step below resolves cosign.
          cygpath -w "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Cosign sign-blob (keyless, JSON bundle)
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          # Emit a Sigstore JSON bundle (.sigstore.json) carrying signature
          # + signing certificate + Rekor entry in a single artifact. The
          # kapi-side verifier (sigstore-go) consumes this bundle directly;
          # legacy .sig + .pem pairs would require client-side stitching.
          for tarball in dist/v2/*.tar.gz; do
            cosign sign-blob --yes \
              --new-bundle-format=true \
              --bundle "${tarball}.sigstore.json" \
              "${tarball}"
          done

      - name: Upload v2 plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v2-${{ matrix.okapi-version }}-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: |
            dist/v2/*.tar.gz
            dist/v2/*.tar.gz.sha256
            dist/v2/*.sigstore.json

  release:
    needs: [build, package-v2]
    # package-v2 may fail for one platform without blocking the release —
    # any v2 tarballs that exist will still be uploaded.
    if: always() && !cancelled() && github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/okapi-bridge-*.tar.gz
            artifacts/okapi-bridge-*.tar.gz.sha256
            artifacts/kapi-okapi-bridge_*.tar.gz
            artifacts/kapi-okapi-bridge_*.tar.gz.sha256
            artifacts/kapi-okapi-bridge_*.tar.gz.sigstore.json
          generate_release_notes: true

      - name: Set up Go (registry-update build)
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      # Push the new okapi-bridge plugin version into the
      # neokapi/registry manifest-plugins.json so
      # `kapi plugin install okapi-bridge` resolves to this build.
      - name: Update neokapi/registry manifest-plugins.json
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "REGISTRY_TOKEN not set; skipping registry update"
            exit 0
          fi

          # Build the registry-update helper. It lives in the public
          # neokapi/registry repo so no auth is needed to fetch it.
          GOBIN=/tmp go install github.com/neokapi/registry/tools/registry-update@main

          REPO_URL="https://github.com/${REPO}/releases/download/${REF_NAME}"
          CERT_ID="https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${REF_NAME}"

          git clone "https://x-access-token:${REGISTRY_TOKEN}@github.com/neokapi/registry.git" /tmp/registry

          # Resolve all the per-(okapi,platform) tarballs and their
          # sha256 sidecars from the artifacts dir, then register one
          # registry entry per Okapi version with its 5 platform rows.
          for okapi_ver in $(ls okapi-releases | sort -V); do
            args=()
            for plat in linux/amd64 linux/arm64 darwin/arm64 windows/amd64 windows/arm64; do
              os=${plat%/*}
              arch=${plat#*/}
              file="kapi-okapi-bridge_${okapi_ver}_${os}_${arch}.tar.gz"
              sha_file="artifacts/${file}.sha256"
              [ -f "$sha_file" ] || continue
              sha=$(awk '{print $1}' "$sha_file")
              args+=(
                "--platform" "$plat"
                "--url" "${REPO_URL}/${file}"
                "--sha256" "$sha"
                "--signature" "${REPO_URL}/${file}.sigstore.json"
              )
            done
            [ ${#args[@]} -eq 0 ] && continue
            /tmp/registry-update \
              --registry /tmp/registry/manifest-plugins.json \
              --plugin okapi-bridge \
              --version "$okapi_ver" \
              --channel stable \
              --released "$(date -u +%Y-%m-%d)" \
              --min-kapi-version 1.0.0 \
              --cert-identity "$CERT_ID" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              "${args[@]}"
          done

          cd /tmp/registry
          git config user.email "release-bot@neokapi.dev"
          git config user.name "release-bot"
          git add manifest-plugins.json
          if ! git diff --staged --quiet; then
            git commit -m "Register okapi-bridge ${REF_NAME}"
            git push
          fi

  publish-testdata:
    name: Trigger Okapi Test Data
    needs: [setup, release]
    if: always() && !cancelled() && needs.release.result == 'success'
    uses: ./.github/workflows/okapi-testdata.yml
    with:
      okapi_version: ${{ needs.setup.outputs.latest }}
    secrets: inherit

